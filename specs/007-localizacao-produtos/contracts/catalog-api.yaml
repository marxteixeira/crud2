openapi: 3.0.3
info:
  title: Sistema de Estoque - API de produtos e localizações
  version: 1.0.0
  description: >
    Endpoints autenticados para estantes, prateleiras e produtos. A autorização
    de preço é verificada no servidor. Operadores podem cadastrar produtos sem
    preço somente como inativos; somente Administradores definem preços.
servers:
  - url: http://localhost:5013
security:
  - bearerAuth: []
paths:
  /api/locations/racks:
    get:
      operationId: listRacks
      summary: Listar estantes
      parameters:
        - $ref: "#/components/parameters/StatusFilter"
      responses:
        "200":
          description: Estantes correspondentes, com suas prateleiras.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rack"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createRack
      summary: Cadastrar estante
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRackRequest"
      responses:
        "201":
          description: Estante criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rack"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/locations/racks/{rackId}:
    parameters:
      - $ref: "#/components/parameters/RackId"
    get:
      operationId: getRack
      summary: Consultar estante e prateleiras
      responses:
        "200":
          description: Estante encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rack"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateRack
      summary: Editar estante
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRackRequest"
      responses:
        "200":
          description: Estante atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rack"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/locations/racks/{rackId}/status:
    put:
      operationId: setRackStatus
      summary: Ativar ou inativar estante
      parameters:
        - $ref: "#/components/parameters/RackId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetStatusRequest"
      responses:
        "204":
          description: Situação atualizada.
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/locations/racks/{rackId}/shelves:
    parameters:
      - $ref: "#/components/parameters/RackId"
    get:
      operationId: listShelves
      summary: Listar prateleiras de uma estante
      parameters:
        - $ref: "#/components/parameters/StatusFilter"
      responses:
        "200":
          description: Prateleiras correspondentes à estante.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shelf"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createShelf
      summary: Cadastrar prateleira na estante
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShelfRequest"
      responses:
        "201":
          description: Prateleira criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shelf"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/locations/racks/{rackId}/shelves/{shelfId}:
    parameters:
      - $ref: "#/components/parameters/RackId"
      - $ref: "#/components/parameters/ShelfId"
    patch:
      operationId: updateShelf
      summary: Editar prateleira
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShelfRequest"
      responses:
        "200":
          description: Prateleira atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shelf"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/locations/racks/{rackId}/shelves/{shelfId}/status:
    put:
      operationId: setShelfStatus
      summary: Ativar ou inativar prateleira
      parameters:
        - $ref: "#/components/parameters/RackId"
        - $ref: "#/components/parameters/ShelfId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetStatusRequest"
      responses:
        "204":
          description: Situação atualizada.
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/products:
    get:
      operationId: listProducts
      summary: Pesquisar e filtrar produtos
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: rackId
          in: query
          schema:
            type: string
            format: uuid
        - name: shelfId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RecordStatus"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Página de produtos; filtros são combinados por conjunção.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProducts"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProduct
      summary: Cadastrar produto
      description: >
        Administrador pode criar produto ativo com preço e localização válidos.
        Operador não pode fornecer preço e cria produto inativo sem preço;
        somente Administrador pode definir o preço e ativá-lo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Produto criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/products/{productId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      operationId: getProduct
      summary: Consultar detalhe do produto
      responses:
        "200":
          description: Produto encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProduct
      summary: Editar produto
      description: O campo price só pode ser enviado por Administrador; Operador não pode definir nem modificar preço.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Produto atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/products/{productId}/status:
    put:
      operationId: setProductStatus
      summary: Ativar ou inativar produto
      description: Ativação exige preço definido por Administrador e localização válida.
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetStatusRequest"
      responses:
        "204":
          description: Situação atualizada.
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/locations/racks/{rackId}/shelves/{shelfId}/products:
    get:
      operationId: listProductsAtShelf
      summary: Consultar produtos de uma localização
      parameters:
        - $ref: "#/components/parameters/RackId"
        - $ref: "#/components/parameters/ShelfId"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RecordStatus"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Produtos paginados na prateleira.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProducts"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RackId:
      name: rackId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShelfId:
      name: shelfId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StatusFilter:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/RecordStatus"
  responses:
    Unauthorized:
      description: Sessão ausente, inválida, expirada, revogada ou conta inativa.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: A pessoa autenticada não possui permissão para a operação.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: Produto ou localização não encontrada.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ValidationProblem:
      description: Entrada inválida ou violação de regra de negócio.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Conflict:
      description: Nome/código duplicado ou operação incompatível com os vínculos/estado atuais.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    RecordStatus:
      type: string
      enum: [Active, Inactive]
    Rack:
      type: object
      required: [id, code, status, shelves]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/RecordStatus"
        shelves:
          type: array
          items:
            $ref: "#/components/schemas/Shelf"
    Shelf:
      type: object
      required: [id, rackId, code, status]
      properties:
        id:
          type: string
          format: uuid
        rackId:
          type: string
          format: uuid
        code:
          type: string
        status:
          $ref: "#/components/schemas/RecordStatus"
    Product:
      type: object
      required: [id, name, quantity, price, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        quantity:
          type: integer
          minimum: 0
        price:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: Obrigatório quando status é Active; null apenas para produto Inactive.
        shelfId:
          type: string
          format: uuid
          nullable: true
        rack:
          type: string
          nullable: true
        shelf:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/RecordStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PaginatedProducts:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    CreateRackRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
    UpdateRackRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
    CreateShelfRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
    UpdateShelfRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
    SetStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/RecordStatus"
    CreateProductRequest:
      type: object
      required: [name, quantity]
      properties:
        name:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 0
        price:
          type: number
          format: double
          minimum: 0
          description: Somente Administrador pode enviar. Produto sem preço é criado Inactive.
        shelfId:
          type: string
          format: uuid
          description: Obrigatório para produto Active; Operador pode criar produto Inactive sem localização.
    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 0
        price:
          type: number
          format: double
          minimum: 0
          description: Opcional; somente Administrador pode enviar este campo.
        shelfId:
          type: string
          format: uuid
          nullable: true
    ProblemDetails:
      type: object
      required: [type, title, status, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        traceId:
          type: string
