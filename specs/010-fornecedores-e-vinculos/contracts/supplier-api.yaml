openapi: 3.0.3
info:
  title: Sistema de Estoque - API de fornecedores e vínculos
  version: 1.0.0
  description: >
    Endpoints autenticados para cadastro de fornecedores, consulta e manutenção
    de vínculos de fornecimento e filtro do catálogo de produtos.
servers:
  - url: http://localhost:5013
security:
  - bearerAuth: []
paths:
  /api/suppliers:
    get:
      operationId: listSuppliers
      summary: Listar e pesquisar fornecedores
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Fornecedores paginados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedSuppliers"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSupplier
      summary: Cadastrar fornecedor
      description: Somente Administrador. CPF/CNPJ é validado e normalizado antes da persistência.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "201":
          description: Fornecedor criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/suppliers/{supplierId}:
    parameters:
      - $ref: "#/components/parameters/SupplierId"
    get:
      operationId: getSupplier
      summary: Consultar dados do fornecedor
      responses:
        "200":
          description: Fornecedor encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSupplier
      summary: Editar fornecedor
      description: Somente Administrador.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierUpdateRequest"
      responses:
        "200":
          description: Fornecedor atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/suppliers/{supplierId}/status:
    put:
      operationId: setSupplierStatus
      summary: Ativar ou inativar fornecedor
      description: Somente Administrador. Inativação conflita se houver produto ativo associado.
      parameters:
        - $ref: "#/components/parameters/SupplierId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetStatusRequest"
      responses:
        "204":
          description: Situação atualizada.
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/suppliers/{supplierId}/products:
    get:
      operationId: listProductsForSupplier
      summary: Listar produtos com vínculo ativo ao fornecedor
      parameters:
        - $ref: "#/components/parameters/SupplierId"
        - $ref: "#/components/parameters/ProductStatusFilter"
        - $ref: "#/components/parameters/LinkStatusFilter"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Produtos paginados; linkStatus permite consultar associações históricas inativas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProductSupplierLinks"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/products:
    get:
      operationId: listProducts
      summary: Listar produtos com filtro opcional por fornecedor
      description: O filtro supplierId compõe-se aos filtros já existentes do catálogo.
      parameters:
        - name: supplierId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: rackId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: shelfId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Produtos paginados que correspondem a todos os filtros.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProducts"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/products/{productId}/suppliers:
    get:
      operationId: listSuppliersForProduct
      summary: Listar vínculos de fornecedor do produto
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/LinkStatusFilter"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Vínculos paginados; situação permite consultar relações históricas inativas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedSupplierLinks"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/products/{productId}/suppliers/{supplierId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
      - $ref: "#/components/parameters/SupplierId"
    put:
      operationId: associateSupplier
      summary: Associar fornecedor ao produto
      description: Exige permissão de edição do produto; ambos os cadastros precisam estar ativos.
      responses:
        "204":
          description: Associação criada ou reativada.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: disassociateSupplier
      summary: Desassociar fornecedor do produto
      description: Exige permissão de edição do produto; a associação é inativada para preservar auditoria.
      responses:
        "204":
          description: Associação desativada.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SupplierId:
      name: supplierId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
    StatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [Active, Inactive]
    ProductStatusFilter:
      name: status
      in: query
      required: false
      description: Filtra a situação do produto independentemente da situação do vínculo.
      schema:
        type: string
        enum: [Active, Inactive]
    LinkStatusFilter:
      name: linkStatus
      in: query
      required: false
      description: Situação da associação; omitida por padrão significa vínculos ativos.
      schema:
        type: string
        enum: [Active, Inactive]
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  schemas:
    SupplierInput:
      type: object
      required: [name, taxIdentifier]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        taxIdentifier:
          type: string
          description: CPF ou CNPJ válido, com ou sem pontuação.
          example: "12.345.678/0001-90"
        phone:
          type: string
          nullable: true
          maxLength: 30
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        contactName:
          type: string
          nullable: true
          maxLength: 200
        notes:
          type: string
          nullable: true
          maxLength: 2000
    SupplierUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        taxIdentifier:
          type: string
          description: CPF ou CNPJ válido, com ou sem pontuação.
        phone:
          type: string
          nullable: true
          maxLength: 30
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        contactName:
          type: string
          nullable: true
          maxLength: 200
        notes:
          type: string
          nullable: true
          maxLength: 2000
    Supplier:
      allOf:
        - $ref: "#/components/schemas/SupplierInput"
        - type: object
          required: [id, status, createdAt, updatedAt, createdBy, updatedBy]
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [Active, Inactive]
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            createdBy:
              type: string
              format: uuid
            updatedBy:
              type: string
              format: uuid
    SupplierLink:
      type: object
      required: [supplierId, supplierName, taxIdentifier, supplierStatus, linkStatus, createdAt, updatedAt, createdBy, updatedBy]
      properties:
        supplierId:
          type: string
          format: uuid
        supplierName:
          type: string
        taxIdentifier:
          type: string
        supplierStatus:
          type: string
          enum: [Active, Inactive]
        linkStatus:
          type: string
          enum: [Active, Inactive]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        updatedBy:
          type: string
          format: uuid
    ProductSupplierLink:
      type: object
      required: [productId, productName, productStatus, linkStatus, createdAt, updatedAt, createdBy, updatedBy]
      properties:
        productId:
          type: string
          format: uuid
        productName:
          type: string
        productStatus:
          type: string
          enum: [Active, Inactive]
        linkStatus:
          type: string
          enum: [Active, Inactive]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        updatedBy:
          type: string
          format: uuid
    PaginatedSupplierLinks:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SupplierLink"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    PaginatedProductSupplierLinks:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductSupplierLink"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    ProductSummary:
      type: object
      required: [id, name, quantity, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        quantity:
          type: integer
        status:
          type: string
          enum: [Active, Inactive]
    PaginatedSuppliers:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Supplier"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    PaginatedProducts:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductSummary"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    SetStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [Active, Inactive]
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        traceId:
          type: string
    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
  responses:
    Unauthorized:
      description: Autenticação ausente ou inválida.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: Perfil sem permissão para a operação.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: Registro não encontrado.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Conflict:
      description: Identificador duplicado, associação inválida ou situação incompatível.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ValidationProblem:
      description: Dados inválidos.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblem"
